
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dxedu SAT - Math Practice</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080d1c;
    color: white;
}

header {
    padding: 22px 7%;
    background: #101a31;
    border-bottom: 1px solid #26334f;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    color: #70a5ff;
}

.container {
    max-width: 850px;
    margin: 45px auto;
    padding: 20px;
}

.top {
    display: flex;
    justify-content: space-between;
    color: #9eafd0;
    margin-bottom: 15px;
}

.progress {
    height: 7px;
    background: #25314a;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 10%;
    background: #558cff;
    transition: width .3s;
}

.card {
    background: #111c34;
    border: 1px solid #263653;
    border-radius: 17px;
    padding: 30px;
    margin-top: 25px;
}

.tag {
    color: #7daaff;
    font-size: 13px;
    font-weight: bold;
}

h1 {
    font-size: 27px;
}

.question {
    font-size: 21px;
    line-height: 1.6;
    margin: 30px 0;
}

.answers {
    display: grid;
    gap: 13px;
}

.answer {
    background: #192742;
    border: 1px solid #344666;
    border-radius: 10px;
    padding: 17px;
    cursor: pointer;
    font-size: 16px;
    color: white;
    text-align: left;
}

.answer:hover {
    border-color: #6a9bff;
}

.answer.selected {
    background: #203c70;
    border-color: #70a5ff;
}

.answer.correct {
    background: #174d3b;
    border-color: #34c98a;
}

.answer.wrong {
    background: #572b37;
    border-color: #ff7187;
}

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 30px;
    gap: 12px;
}

button {
    border: none;
    padding: 14px 24px;
    border-radius: 9px;
    background: #558cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

#feedback {
    color: #a9bad7;
    line-height: 1.5;
    margin-top: 20px;
}

@media(max-width:600px) {
    .container {
        margin: 15px auto;
    }
    .card {
        padding: 20px;
    }
    h1 {
        font-size: 22px;
    }
    .question {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">DXEDU SAT</div>
    <div>SAT Math Practice</div>
</header>

<main class="container">

    <div class="top">
        <span>Math Practice</span>
        <span id="counter">Question 1 / 15</span>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progress"></div>
    </div>

    <section class="card" id="quiz">
        <div class="tag">SAT MATH · PRACTICE</div>

        <h1 id="title">Mathematics Question</h1>

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <div id="feedback"></div>

        <div class="bottom">
            <span id="score">Score: 0</span>
            <button id="next" onclick="nextQuestion()" disabled>
                Next Question →
            </button>
        </div>
    </section>

</main>

<script>
const questions = [
       {
        question: "If 5x - 7 = 3x + 11, what is the value of x?",
        answers: ["A) 7", "B) 8", "C) 9", "D) 10"],
        correct: 2,
        explanation: "5x - 3x = 11 + 7. Therefore, 2x = 18 and x = 9."
    },
    {
        question: "A car travels 180 miles in 3 hours at a constant speed. How many miles will it travel in 5 hours?",
        answers: ["A) 240", "B) 270", "C) 300", "D) 360"],
        correct: 2,
        explanation: "Speed = 180 / 3 = 60 miles per hour. Distance = 60 × 5 = 300 miles."
    },
    {
        question: "If g(x) = 3x + 4, what is the value of g(6)?",
        answers: ["A) 18", "B) 20", "C) 22", "D) 24"],
        correct: 2,
        explanation: "Substitute x = 6: g(6) = 3(6) + 4 = 22."
    },
  
    {
        question: "If 4(2x - 3) = 5x + 9, what is the value of x?",
        answers: ["A) 5", "B) 6", "C) 7", "D) 8"],
        correct: 2,
        explanation: "Expand: 8x - 12 = 5x + 9. Then 3x = 21, so x = 7."
    },
    {
        question: "The equation x² - 7x + 12 = 0 has two solutions. What is the greater solution?",
        answers: ["A) 2", "B) 3", "C) 4", "D) 6"],
        correct: 2,
        explanation: "Factor: (x - 3)(x - 4) = 0. The solutions are 3 and 4."
    },
    {
        question: "If f(x) = 2x² - 3x, what is the value of f(-2)?",
        answers: ["A) 8", "B) 10", "C) 12", "D) 14"],
        correct: 3,
        explanation: "Substitute -2: 2(-2)² - 3(-2) = 8 + 6 = 14."
    },
    {
        question: "If 2x + 3y = 19 and x - y = 2, what is the value of x?",
        answers: ["A) 3", "B) 4", "C) 5", "D) 7"],
        correct: 2,
        explanation: "From x - y = 2, x = y + 2. Substitute: 2(y + 2) + 3y = 19. Thus y = 3 and x = 5."
    },
    {
        question: "A population of 500 increases by 8% each year. What will the population be after 2 years?",
        answers: ["A) 540", "B) 560", "C) 580", "D) 583.2"],
        correct: 3,
        explanation: "Use exponential growth: 500(1.08)² = 583.2."
    },
    {
        question: "A circle has a radius of 6 inches. What is its area?",
        answers: ["A) 12π", "B) 24π", "C) 36π", "D) 48π"],
        correct: 2,
        explanation: "Area = πr² = π(6²) = 36π square inches."
    },
    {
        question: "A jacket costs $72 after a 20% discount. What was its original price?",
        answers: ["A) $80", "B) $86", "C) $90", "D) $96"],
        correct: 2,
        explanation: "72 represents 80% of the original price. Original price = 72 ÷ 0.8 = $90."
    },
    {
        question: "What is the slope of the line passing through (2, 5) and (6, 13)?",
        answers: ["A) 1", "B) 2", "C) 3", "D) 4"],
        correct: 1,
        explanation: "Slope = (13 - 5) / (6 - 2) = 8 / 4 = 2."
    },
    {
        question: "What is the smaller solution of x² + 4x - 12 = 0?",
        answers: ["A) -6", "B) -4", "C) 2", "D) 6"],
        correct: 0,
        explanation: "Factor: (x + 6)(x - 2) = 0. The solutions are -6 and 2. The smaller is -6."
    },
    {
        question: "The numbers 4, 7, 7, 8, and 14 form a data set. What is the mean?",
        answers: ["A) 7", "B) 8", "C) 9", "D) 10"],
        correct: 1,
        explanation: "Mean = (4 + 7 + 7 + 8 + 14) / 5 = 40 / 5 = 8."
    },
    {
        question: "If 3(2x - 1) > 15, which inequality describes all possible values of x?",
        answers: ["A) x > 2", "B) x > 3", "C) x < 3", "D) x < 6"],
        correct: 1,
        explanation: "6x - 3 > 15. Add 3: 6x > 18. Divide by 6: x > 3."
    },
    {
        question: "Two similar triangles have corresponding side lengths in a ratio of 3:2. If the smaller triangle has an area of 20, what is the area of the larger triangle?",
        answers: ["A) 25", "B) 30", "C) 40", "D) 45"],
        correct: 3,
        explanation: "Area scales by the square of the side ratio. 20 × (3/2)² = 20 × 9/4 = 45."
    }


];

let current = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;

    const q = questions[current];

    document.getElementById("counter").textContent =
        `Question ${current + 1} / ${questions.length}`;

    document.getElementById("progress").style.width =
        `${((current + 1) / questions.length) * 100}%`;

    document.getElementById("title").textContent =
        `Question ${current + 1}`;

    document.getElementById("question").textContent = q.question;

    document.getElementById("feedback").textContent = "";

    document.getElementById("next").disabled = true;

    const answers = document.getElementById("answers");
    answers.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");

        button.className = "answer";
        button.textContent = answer;

        button.onclick = () => checkAnswer(index, button);

        answers.appendChild(button);
    });
}

function checkAnswer(index, button) {
    if (answered) return;

    answered = true;

    const q = questions[current];
    const allButtons = document.querySelectorAll(".answer");

    allButtons.forEach((b, i) => {
        b.disabled = true;

        if (i === q.correct) {
            b.classList.add("correct");
        }
    });

    if (index === q.correct) {
        score++;
        button.classList.add("correct");
        document.getElementById("feedback").textContent =
            "Correct! " + q.explanation;
    } else {
        button.classList.add("wrong");
        document.getElementById("feedback").textContent =
            "Incorrect. " + q.explanation;
    }

    document.getElementById("score").textContent =
        `Score: ${score}`;

    document.getElementById("next").disabled = false;
}
function nextQuestion() {
    current++;

    if (current >= questions.length) {

        let completed = Number(
            localStorage.getItem("dxeduQuestionsCompleted") || 0
        );

        completed += questions.length;

        localStorage.setItem(
            "dxeduQuestionsCompleted",
            completed
        );

        showResult();

    } else {
        loadQuestion();
    }
}



function showResult() {
    const estimatedScore = Math.round(
        200 + (score / questions.length) * 600
    );

    const percentage = Math.round(
        score / questions.length * 100
    );

    localStorage.setItem("dxeduMathScore", estimatedScore);

    const result = {
        subject: "SAT Math",
        score: estimatedScore,
        total: 800,
        rawScore: score,
        percentage: percentage,
        correct: score,
        incorrect: questions.length - score,
        date: new Date().toLocaleString()
    };

    let results = JSON.parse(
        localStorage.getItem("dxeduMathResults") || "[]"
    );

    results.push(result);

    localStorage.setItem(
        "dxeduMathResults",
        JSON.stringify(results)
    );

    document.getElementById("quiz").innerHTML = `
        <div class="tag">TEST COMPLETED</div>
        <h1>Practice Results</h1>

        <div class="question">
            You answered ${score} out of ${questions.length} questions correctly.
        </div>

        <h2>Accuracy: ${percentage}%</h2>

        <h2>Estimated SAT Math Score: ${estimatedScore} / 800</h2>

        <button onclick="restartQuiz()">Try Again</button>

        <button onclick="saveAndDashboard()" style="margin-top:12px;">
            Save Score & Dashboard →
        </button>
    `;
}


function saveAndDashboard() {
    const estimatedScore = Math.round(
        200 + (score / questions.length) * 600
    );

    localStorage.setItem("dxeduMathScore", estimatedScore);
    window.location.href = "/";
}

function restartQuiz() {
    current = 0;
    score = 0;

    document.getElementById("quiz").innerHTML = `
        <div class="tag">SAT MATH · PRACTICE</div>
        <h1 id="title">Mathematics Question</h1>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div id="feedback"></div>
        <div class="bottom">
            <span id="score">Score: 0</span>
            <button id="next" onclick="nextQuestion()" disabled>
                Next Question →
            </button>
        </div>
    `;

    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
